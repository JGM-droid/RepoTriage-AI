services:
  db:
    # PostgreSQL 17 with the pgvector extension pre-installed (Milestone
    # 2.3, ADR 0009). Pinned to a specific pgvector release + Debian base,
    # not the floating "pg17" tag, so the image is reproducible.
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGIN: ${CORS_ORIGIN}
      REDIS_URL: redis://redis:6379/0
      # Mock by default: the stack stays free and offline unless AI_PROVIDER
      # is explicitly set to openai (with an API key) in the environment/.env.
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-20}
      OPENAI_INPUT_PRICE_PER_MILLION_USD: ${OPENAI_INPUT_PRICE_PER_MILLION_USD:-0.15}
      OPENAI_OUTPUT_PRICE_PER_MILLION_USD: ${OPENAI_OUTPUT_PRICE_PER_MILLION_USD:-0.60}
      # Local by default: a real, local, CPU-only embedding model baked
      # into the image (no paid API, no runtime network call). "fake" is
      # for tests only.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      RETRIEVAL_MAX_RESULTS: ${RETRIEVAL_MAX_RESULTS:-3}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: ./backend
    command: celery -A app.workflow.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGIN: ${CORS_ORIGIN}
      REDIS_URL: redis://redis:6379/0
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-20}
      OPENAI_INPUT_PRICE_PER_MILLION_USD: ${OPENAI_INPUT_PRICE_PER_MILLION_USD:-0.15}
      OPENAI_OUTPUT_PRICE_PER_MILLION_USD: ${OPENAI_OUTPUT_PRICE_PER_MILLION_USD:-0.60}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      RETRIEVAL_MAX_RESULTS: ${RETRIEVAL_MAX_RESULTS:-3}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then((response) => { if (!response.ok) process.exit(1) })"]
      interval: 10s
      timeout: 3s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./ops/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v3.7.3
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./ops/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - otel-collector
    ports:
      - "9090:9090"

volumes:
  postgres_data:
