name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector-enabled PostgreSQL 17, matching compose.yaml's pinned
        # image exactly (Milestone 2.3, ADR 0009) -- migration 20260916_0004
        # requires the vector extension, which the plain postgres image
        # this service used before did not provide.
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_DB: repotriage
          POSTGRES_USER: repotriage
          POSTGRES_PASSWORD: repotriage
        options: >-
          --health-cmd "pg_isready -U repotriage -d repotriage"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -e "backend[dev]"
      - name: Check backend formatting and lint
        run: |
          ruff format --check backend
          ruff check backend
      - name: Apply database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://repotriage:repotriage@localhost:5432/repotriage
        run: alembic upgrade head
      - name: Test backend
        env:
          DATABASE_URL: postgresql+psycopg://repotriage:repotriage@localhost:5432/repotriage
        run: pytest backend/tests
      - name: Run evaluation regression gate
        # Milestone 2.5 / ADR 0011. Deterministic and offline only: mock AI
        # provider, no real retrieval model, no network, no API key, no
        # paid call. Compares against the checked-in baseline
        # (backend/tests/evaluation/baseline.json) and fails the job on any
        # blocking regression; never updates the baseline.
        working-directory: backend
        env:
          AI_PROVIDER: mock
          EMBEDDING_PROVIDER: fake
        run: python -m app.evaluation
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, test, and build frontend
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run build
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config