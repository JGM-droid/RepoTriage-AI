name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_DB: repotriage
          POSTGRES_USER: repotriage
          POSTGRES_PASSWORD: repotriage
        options: >-
          --health-cmd "pg_isready -U repotriage -d repotriage"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -e "backend[dev]"
      - name: Check backend formatting and lint
        run: |
          ruff format --check backend
          ruff check backend
      - name: Apply database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://repotriage:repotriage@localhost:5432/repotriage
        run: alembic upgrade head
      - name: Test backend
        env:
          DATABASE_URL: postgresql+psycopg://repotriage:repotriage@localhost:5432/repotriage
        run: pytest backend/tests
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, test, and build frontend
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run build
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config