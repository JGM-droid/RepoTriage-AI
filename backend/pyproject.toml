[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repotriage-api"
version = "0.1.0"
description = "RepoTriage AI foundation API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
    "ruff==0.9.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
include = ["app*"]